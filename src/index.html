<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clinical Research Task Manager</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
      max-width: 500px;
      margin: 20px;
    }
    h1 {
      color: #1a1a2e;
      margin-bottom: 10px;
      font-size: 24px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 15px 40px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }
    .note {
      margin-top: 20px;
      color: #888;
      font-size: 12px;
    }
    .iframe-container {
      margin-top: 20px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    iframe {
      width: 100%;
      height: 600px;
      border: none;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      justify-content: center;
    }
    .tab {
      padding: 10px 20px;
      border: none;
      background: #f0f0f0;
      border-radius: 25px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    .tab.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏥 Clinical Research Task Manager</h1>
    <p class="subtitle">Quản lý công việc nghiên cứu lâm sàng</p>

    <div class="tabs">
      <button class="tab active" onclick="showView('launch')">🚀 Mở Ứng dụng</button>
      <button class="tab" onclick="showView('embed')">📋 Xem trước</button>
    </div>

    <div id="launch-view">
      <a href="https://script.google.com/macros/s/AKfycbw0c-jBJee-B0dMy0Sz1UVhyDAZmWOu3kv16eiJNsG-/dev" target="_blank" class="btn">
        ▶️ Khởi động ứng dụng
      </a>
      <p class="note">Ứng dụng sẽ mở trong tab mới</p>
    </div>

    <div id="embed-view" style="display: none;">
      <div class="iframe-container">
        <iframe src="https://script.google.com/macros/s/AKfycbw0c-jBJee-B0dMy0Sz1UVhyDAZmWOu3kv16eiJNsG-/dev"></iframe>
      </div>
    </div>
  </div>

  <script>
    function showView(view) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById('launch-view').style.display = view === 'launch' ? 'block' : 'none';
      document.getElementById('embed-view').style.display = view === 'embed' ? 'block' : 'none';
      event.target.classList.add('active');
    }
  </script>
</body>
</html>
