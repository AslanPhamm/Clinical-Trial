name: Deploy to Apps Script

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      exec_url: ${{ steps.resolve-deployment.outputs.exec_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g clasp

      - name: Authorize clasp
        env:
          CLIENT_ID: ${{ secrets.CLASP_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLASP_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CLASP_REFRESH_TOKEN }}
          ACCESS_TOKEN: ${{ secrets.CLASP_ACCESS_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import json
          import os

          # clasp 3.x reads ~/.clasprc.json as {"tokens": {"<user>": <StoredCredential>}}.
          # (the old flat {"token": {...}} shape from clasp 2.x is no longer recognized)
          config = {
              "tokens": {
                  "default": {
                      "type": "authorized_user",
                      "client_id": os.environ["CLIENT_ID"],
                      "client_secret": os.environ["CLIENT_SECRET"],
                      "refresh_token": os.environ["REFRESH_TOKEN"],
                      "access_token": os.environ["ACCESS_TOKEN"],
                      "token_type": "Bearer",
                      "expiry_date": 0
                  }
              }
          }

          with open(os.path.expanduser("~/.clasprc.json"), "w") as f:
              json.dump(config, f, indent=2)

          print("clasprc.json created successfully")
          PYEOF

      - name: Create clasp project config
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          python3 << 'PYEOF'
          import json
          import os

          config = {
              "scriptId": os.environ["APPS_SCRIPT_ID"],
              "rootDir": "src"
          }

          with open(".clasp.json", "w") as f:
              json.dump(config, f, indent=2)

          print(".clasp.json created successfully")
          PYEOF

      - name: Push to Apps Script
        run: clasp push --force

      - name: Resolve deployment and build redirect page
        id: resolve-deployment
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          set +e
          EXISTING_ID=$(gh api "repos/$REPO/actions/variables/APPS_SCRIPT_DEPLOYMENT_ID" --jq .value 2>/dev/null)
          API_STATUS=$?
          set -e
          if [ $API_STATUS -ne 0 ]; then
            EXISTING_ID=""
          fi

          DESCRIPTION="Auto-deploy $(date '+%Y-%m-%d %H:%M:%S')"
          DEPLOYMENT_ID=""

          if [ -n "$EXISTING_ID" ]; then
            echo "Reusing existing deployment: $EXISTING_ID"
            set +e
            DEPLOY_OUTPUT=$(clasp deploy --deploymentId "$EXISTING_ID" --description "$DESCRIPTION" 2>&1)
            DEPLOY_STATUS=$?
            set -e
            echo "$DEPLOY_OUTPUT"
            if [ $DEPLOY_STATUS -eq 0 ] && ! echo "$DEPLOY_OUTPUT" | grep -qi "invalid deployment"; then
              DEPLOYMENT_ID="$EXISTING_ID"
            else
              echo "Saved deployment id is no longer valid, will create a new deployment instead"
            fi
          fi

          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "Creating a new deployment"
            DEPLOY_OUTPUT=$(clasp deploy --description "$DESCRIPTION")
            echo "$DEPLOY_OUTPUT"
            DEPLOYMENT_ID=$(echo "$DEPLOY_OUTPUT" | grep -oE 'AKfycb[A-Za-z0-9_-]+' | head -1)

            if [ -z "$DEPLOYMENT_ID" ]; then
              echo "::error::Could not parse a deployment id out of clasp's output"
              exit 1
            fi

            gh variable set APPS_SCRIPT_DEPLOYMENT_ID --repo "$REPO" --body "$DEPLOYMENT_ID"
            echo "Saved new deployment id for future runs: $DEPLOYMENT_ID"
          fi

          EXEC_URL="https://script.google.com/macros/s/${DEPLOYMENT_ID}/exec"
          echo "Apps Script URL: $EXEC_URL"
          echo "exec_url=$EXEC_URL" >> "$GITHUB_OUTPUT"

          cat > index.html << HTML
          <!DOCTYPE html>
          <html>
          <head>
          <meta http-equiv="refresh" content="0;url=${EXEC_URL}">
          <title>Redirecting...</title>
          </head>
          <body>
          <p>Redirecting to <a href="${EXEC_URL}">App</a>...</p>
          </body>
          </html>
          HTML

      - name: Upload redirect page artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-redirect
          path: index.html

  deploy-pages:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download redirect page artifact
        uses: actions/download-artifact@v4
        with:
          name: pages-redirect

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
