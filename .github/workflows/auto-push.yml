name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'src'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  auto-push:
    needs: deploy-pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Create new branch and push
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BRANCH_NAME="auto-${TIMESTAMP}"

          git checkout -b "$BRANCH_NAME"
          git add -A

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🚀 Auto-update: $(date '+%Y-%m-%d %H:%M:%S')"
            git push -u origin "$BRANCH_NAME"
            echo "✅ Pushed to: https://github.com/${{ github.repository }}/tree/$BRANCH_NAME"
          fi

      - name: Create Pull Request
        if: env.GH_TOKEN != ''
        run: |
          gh pr create \
            --title "Auto PR: $BRANCH_NAME" \
            --body "🤖 Auto-updated by GitHub Actions" \
            --base main || echo "PR may already exist"
