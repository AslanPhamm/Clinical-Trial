name: Auto Push to New Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Tên branch mới (mặc định: auto-{timestamp})'
        required: false
        type: string

jobs:
  push-to-new-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Create new branch and push
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # Tạo tên branch với timestamp
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BRANCH_NAME="${{ inputs.branch_name || 'auto' }}-${TIMESTAMP}"

          echo "📌 Tạo branch mới: $BRANCH_NAME"

          # Tạo branch mới
          git checkout -b "$BRANCH_NAME"

          # Commit tất cả thay đổi (nếu có)
          git add -A

          # Kiểm tra xem có thay đổi không
          if git diff --staged --quiet; then
            echo "⚠️ Không có thay đổi mới để commit"
          else
            # Commit với message
            git commit -m "🚀 Auto-update: $(date '+%Y-%m-%d %H:%M:%S')"

            # Push lên remote
            git push -u origin "$BRANCH_NAME"

            echo "✅ Đã push thành công lên branch: $BRANCH_NAME"
            echo "🔗 https://github.com/${{ github.repository }}/tree/$BRANCH_NAME"
          fi

      - name: Create Pull Request (optional)
        if: env.GH_TOKEN != ''
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BRANCH_NAME="${{ inputs.branch_name || 'auto' }}-${TIMESTAMP}"

          # Kiểm tra xem branch đã push chưa
          if git rev-parse --verify "$BRANCH_NAME" >/dev/null 2>&1; then
            echo "📝 Tạo Pull Request..."
            PR_BODY="🤖 Generated by GitHub Actions - Auto Push Workflow\n\nBranch: ${BRANCH_NAME}\nCreated: $(date '+%Y-%m-%d %H:%M:%S')\n\n---\nGenerated with [Claude Code](https://claude.com/claude-code)"
            gh pr create \
              --title "Auto PR: $BRANCH_NAME" \
              --body "$PR_BODY" \
              --base main \
              --head "$BRANCH_NAME" \
              || echo "⚠️ Không thể tạo PR (có thể đã tồn tại hoặc cần quyền)"
          fi
